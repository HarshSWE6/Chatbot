<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechNova — AI Customer Support</title>
  <meta name="description" content="AI-powered customer support for TechNova Electronics. Get instant answers about products, pricing, shipping, and more.">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <canvas id="particleCanvas" aria-hidden="true"></canvas>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-name">TechNova</span>
          <span class="logo-sub">AI Support</span>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-label">Quick Topics</span>
      <button class="nav-item active" data-q="Hi! What can you help me with?">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>General Help</span>
      </button>
      <button class="nav-item" data-q="Show me all your products and pricing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span>Products</span>
      </button>
      <button class="nav-item" data-q="What discounts and deals do you currently offer?">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        <span>Pricing & Deals</span>
      </button>
      <button class="nav-item" data-q="What are your shipping options and delivery times?">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <span>Shipping</span>
      </button>
      <button class="nav-item" data-q="Explain your return policy and warranty coverage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg>
        <span>Returns & Warranty</span>
      </button>
      <button class="nav-item" data-q="How can I contact your support team?">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span>Contact Support</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="aiStatus">AI Assistant Online</span>
      </div>
    </div>
  </aside>

  <!-- ══════════ MAIN ══════════ -->
  <main class="chat-main">

    <header class="chat-header">
      <button class="menu-btn" id="menuBtn" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="header-info">
        <div class="header-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div>
          <h1 class="header-title">Nova</h1>
          <span class="header-status" id="headerStatus">TechNova AI Support</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-action-btn theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="header-action-btn" id="clearBtn" aria-label="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
      </div>
    </header>

    <div class="chat-body" id="chatBody">
      <div class="messages-container" id="messagesContainer"></div>
    </div>

    <div class="quick-replies" id="quickReplies">
      <button class="quick-reply-btn" data-q="What products do you sell?">🛍️ Products</button>
      <button class="quick-reply-btn" data-q="Compare your smartphones">📱 Phones</button>
      <button class="quick-reply-btn" data-q="Which laptop is best for a student?">💻 Laptops</button>
      <button class="quick-reply-btn" data-q="How does shipping work?">📦 Shipping</button>
      <button class="quick-reply-btn" data-q="What is your return policy?">↩️ Returns</button>
      <button class="quick-reply-btn" data-q="I need help with my order">📞 Support</button>
    </div>

    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea id="userInput" class="chat-input" placeholder="Ask Nova anything..." rows="1" aria-label="Type your message"></textarea>
        <button class="mic-btn" id="micBtn" aria-label="Voice input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <span class="input-hint">Enter to send · Shift+Enter for new line</span>
    </div>

  </main>

  <script src="chatbot.js"></script>
</body>
</html>
